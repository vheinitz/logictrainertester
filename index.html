<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOGIK-Trainer</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--primary:#5B4FCF;--primary-light:#7B70E8;--secondary:#FF6B6B;--accent:#4ECDC4;--gold:#FFD93D;--orange:#FF8A5C;--green:#6BCB77;--blue:#4D96FF;--pink:#FF6B9D;--bg:#F8F7FF;--card-bg:#FFFFFF;--text:#2D2A4A;--text-light:#6E6B8A;--shadow:0 4px 20px rgba(91,79,207,0.1);--shadow-hover:0 8px 30px rgba(91,79,207,0.18);--radius:20px;--radius-sm:12px}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5}
header{background:linear-gradient(135deg,#5B4FCF,#7B70E8,#4ECDC4);color:#fff;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 20px rgba(91,79,207,.3)}
header h1{font-size:1.3em;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px}
.btn-back{background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.4);color:#fff;padding:8px 16px;border-radius:20px;cursor:pointer;font-size:.9em;font-weight:600;transition:all .2s}
.btn-back:hover{background:rgba(255,255,255,.35)}
main{max-width:1000px;margin:0 auto;padding:24px 16px 60px}
.page-title{font-size:1.8em;font-weight:800;margin-bottom:8px;text-align:center}
.page-subtitle{font-size:1em;color:var(--text-light);text-align:center;margin-bottom:28px}
.section-title{font-size:1.2em;font-weight:700;margin:24px 0 12px;padding-left:12px;border-left:4px solid var(--primary)}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:var(--card-bg);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);cursor:pointer;transition:all .25s;border:2px solid transparent;overflow:hidden}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover)}
/* Sichtbarer Fokus für Tastaturbedienung – ohne ihn ist nicht erkennbar,
   wo man sich gerade befindet. :focus-visible zeigt ihn nur bei Tastatur. */
.card:focus-visible,.info-link:focus-visible,.btn:focus-visible,.tab:focus-visible,.pick-target:focus-visible{outline:3px solid var(--primary);outline-offset:3px}
.card-icon{font-size:2.5em;margin-bottom:8px}
.card-title{font-weight:700;font-size:1.05em;margin-bottom:4px}
.card-desc{font-size:.85em;color:var(--text-light);line-height:1.4}
.card-badges{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.badge{font-size:.7em;padding:3px 10px;border-radius:20px;font-weight:600}
.badge-age{background:#E8F4FD;color:#4D96FF}
.badge-mode-self{background:#E6F9EE;color:#2DA44E}
.badge-mode-tutor{background:#FFF3E6;color:#E07B2C}
.badge-mode-mixed{background:#F3E8FF;color:#7C5CF0}
.card-scale-sequential{border-left:4px solid var(--blue)}
.card-scale-simultan{border-left:4px solid var(--green)}
.card-scale-lernen{border-left:4px solid var(--orange)}
.card-scale-planung{border-left:4px solid var(--secondary)}
.card-scale-wissen{border-left:4px solid var(--primary)}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;justify-content:center}
.tab{padding:8px 18px;border-radius:20px;border:2px solid #E0DDF5;background:#fff;cursor:pointer;font-weight:600;font-size:.9em;color:var(--text-light);transition:all .2s}
.tab:hover{border-color:var(--primary-light);color:var(--primary)}
.tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.training-container{background:var(--card-bg);border-radius:var(--radius);padding:28px;box-shadow:var(--shadow);min-height:400px}
.training-header{display:flex;align-items:center;gap:12px;margin-bottom:20px;padding-bottom:16px;border-bottom:2px solid #F0EFF8}
.training-header .icon{font-size:2em}
.training-header h2{font-size:1.3em}
.training-area{min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.btn{display:inline-flex;align-items:center;gap:6px;padding:12px 28px;border-radius:24px;border:none;font-weight:700;font-size:1em;cursor:pointer;transition:all .2s;font-family:inherit}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-light)}
.btn-secondary{background:#F0EFF8;color:var(--primary)}.btn-secondary:hover{background:#E4E2F5}
.btn-accent{background:var(--accent);color:#fff}
.btn-small{padding:6px 14px;font-size:.85em;border-radius:16px}
.game-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:10px;margin:16px 0;width:100%;max-width:500px}
.game-card-item{aspect-ratio:1;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:2.2em;cursor:pointer;border:3px solid transparent;background:#F8F7FF;user-select:none;transition:all .2s}
.game-card-item:hover{transform:scale(1.05);border-color:var(--primary-light)}
.game-card-item.correct{border-color:var(--green);background:#E6F9EE}
.game-card-item.wrong{border-color:var(--secondary);background:#FFF0F0;animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.feedback-banner{padding:14px 24px;border-radius:var(--radius-sm);text-align:center;font-weight:700;margin:12px 0;width:100%;max-width:500px}
.feedback-correct{background:#E6F9EE;color:#1A7F37}
.feedback-wrong{background:#FFF0F0;color:#C92A2A}
.score-display{display:flex;align-items:center;gap:20px;margin:12px 0;font-weight:700}
.tutor-guide{background:#FFFBF0;border:2px solid var(--gold);border-radius:var(--radius-sm);padding:20px;margin:16px 0;width:100%;max-width:500px}
.tutor-guide h3{color:#B8860B;margin-bottom:8px;font-size:.95em}
.answer-input{padding:12px 16px;border-radius:24px;border:2px solid #E0DDF5;font-size:1em;font-family:inherit;width:100%;max-width:400px;text-align:center;outline:none}
.answer-input:focus{border-color:var(--primary)}
.options-vertical{display:flex;flex-direction:column;gap:8px;width:100%;max-width:400px}
.option-btn{padding:12px 16px;border-radius:var(--radius-sm);border:2px solid #E0DDF5;background:#fff;cursor:pointer;font-size:1em;font-family:inherit;text-align:left;transition:all .2s}
.option-btn:hover{border-color:var(--primary-light);background:#F8F7FF}
.option-btn.option-correct{border-color:var(--green);background:#E6F9EE}
.quiz-image-placeholder{width:150px;height:150px;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;font-size:4em;background:linear-gradient(135deg,#F8F7FF,#EBE9FF);margin:12px 0}
.memory-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:360px;width:100%}
.memory-card{aspect-ratio:1;border-radius:var(--radius-sm);cursor:pointer;font-size:2em;display:flex;align-items:center;justify-content:center;transition:all .3s;user-select:none}
.memory-card-hidden{background:var(--primary);color:transparent}
.memory-card-revealed{background:#F8F7FF;border:2px solid var(--primary-light)}
.memory-card-matched{background:#E6F9EE;border:2px solid var(--green);opacity:.5;cursor:default}
.info-panel{background:#F0EDFF;border:2px solid var(--primary-light);border-radius:var(--radius);padding:20px;margin:16px 0;width:100%;max-width:600px}
.info-panel h3{color:var(--primary);margin-bottom:12px}
/* Link mit Symbol, der Erklärendes auf eine eigene Seite auslagert */
.info-link{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:22px;background:#F0EDFF;border:2px solid var(--primary-light);color:var(--primary);font-weight:700;font-size:.95em;text-decoration:none;transition:all .2s}
.info-link:hover{background:var(--primary);color:#fff}
/* Einstellungsseite: Beschriftung links, Regler rechts, auf schmalen
   Bildschirmen untereinander */
.setting-row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid #F0EFF8}
.setting-label{flex:1;min-width:210px}
.setting-label b{display:block;font-size:.98em}
.setting-label span{display:block;font-size:.82em;color:var(--text-light);line-height:1.45;margin-top:2px}
input[type=range]{accent-color:var(--primary);height:26px}
.info-panel h4{color:var(--primary);margin:12px 0 4px;font-size:.95em}
.info-panel ul{padding-left:20px;font-size:.9em;line-height:1.6}
/* Ablaufanzeigen laufen als CSS-Animation, damit der Spielbereich während
   einer Aufgabe nicht neu aufgebaut werden muss – ein Neuaufbau zwischen
   mousedown und mouseup verschluckt sonst den Klick. */
@keyframes advBar{0%{width:100%;background:var(--green)}55%{background:var(--gold)}80%{background:var(--secondary)}100%{width:0%;background:var(--secondary)}}
@keyframes advRing{from{stroke-dashoffset:0}to{stroke-dashoffset:188.5}}
.adv-bar{height:100%;border-radius:4px;width:100%;background:var(--green);animation-name:advBar;animation-timing-function:linear;animation-fill-mode:forwards}
.adv-ring{stroke-dasharray:188.5;animation-name:advRing;animation-timing-function:linear;animation-fill-mode:forwards}
/* Klickflächen im Spiel: kein Text-Markieren, keine 300ms-Verzögerung auf
   Touch, kein Grau-Blitzen beim Antippen. */
[onclick]{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.pick-target{user-select:none;-webkit-user-select:none;transition:transform .08s ease-out}
.pick-target:active{transform:scale(.92)}
@media(prefers-reduced-motion:reduce){.pick-target{transition:none}}
@media(max-width:600px){.card-grid{grid-template-columns:1fr}.memory-grid{max-width:300px}.game-grid{grid-template-columns:repeat(3,1fr)}.training-container{padding:16px}}
</style>
</head>
<body>
<header>
  <h1 onclick="navigateTo('menu')"><span class="icon">🧠</span> <span id="headerTitle">LOGIK-Trainer</span></h1>
  <div style="display:flex;align-items:center;gap:8px">
    <button class="btn-back" onclick="setLanguage('de')" id="langDE" style="font-size:.8em;padding:4px 10px">DE</button>
    <button class="btn-back" onclick="setLanguage('ru')" id="langRU" style="font-size:.8em;padding:4px 10px">RU</button>
    <button class="btn-back" onclick="setLanguage('en')" id="langEN" style="font-size:.8em;padding:4px 10px">EN</button>
    <button id="btnBack" class="btn-back" style="display:none" onclick="goBack()">← Zurück</button>
  </div>
</header>
<main id="mainContent"></main>
<!-- Sprachaufnahmen: eigene Dateien, damit das App-Bundle klein bleibt und
     beim Speichern der Seite trotzdem alles mitkommt (siehe core/audio-assets.js) -->
<script src="dist/audio-de.js?v=613846c0"></script>
<script src="dist/audio-en.js?v=4b8e0456"></script>
<script src="dist/audio-ru.js?v=2f369801"></script>
<script src="dist/logik-trainer.min.js?v=c0684278"></script>
<script>
// Ohne Bundle bliebe die Seite einfach weiß – das ist der häufigste
// Stolperstein nach einem frischen Clone.
//
// Geprüft wird, ob der Bundle wirklich lief: er installiert navigateTo() und
// füllt #mainContent. Nicht auf eine Bundle-Variable prüfen – main.js
// exportiert nichts, die wäre auch bei geladenem Bundle leer und der Hinweis
// würde das bereits aufgebaute Menü überschreiben.
window.addEventListener('load', function () {
  var main = document.getElementById('mainContent');
  if (!main) return;
  if (typeof window.navigateTo === 'function') return;
  if (main.innerHTML.trim() !== '') return;
  main.innerHTML =
    '<div class="training-container"><div class="training-area">' +
    '<h2 style="margin-bottom:12px">⚙️ Bundle fehlt</h2>' +
    '<p style="text-align:center">Bitte einmal bauen:<br><code>npm install &amp;&amp; npm run build</code></p>' +
    '</div></div>';
});
</script>
</body>
</html>
