<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Wimmelbild-Suche</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- Auswahl --------------------------------------------------------------->
<section id="start" class="seite">
  <header class="kopf">
    <h1>Wimmelbild-Suche</h1>
    <p class="lead">Fragen in zufälliger Reihenfolge, Antwort per Klick ins Bild.</p>
  </header>

  <div class="inhalt">
    <div class="abschnittskopf">
      <h2>Bild wählen</h2>
      <div class="knopfgruppe">
        <button id="knopf-neu" class="neben klein">Neues Wimmelbild…</button>
        <button id="knopf-import" class="neben klein">Bildsatz importieren…</button>
      </div>
    </div>
    <div id="satzliste" class="kartenliste"></div>

    <h2>Einstellungen</h2>
    <div class="optionen">
      <label>Anzahl Fragen
        <select id="opt-anzahl">
          <option value="10">10</option>
          <option value="20">20</option>
          <option value="0" selected>alle</option>
        </select>
      </label>
      <label>Zeit je Frage
        <select id="opt-zeit">
          <option value="0" selected>ohne Limit</option>
          <option value="15">15 Sekunden</option>
          <option value="30">30 Sekunden</option>
          <option value="60">60 Sekunden</option>
        </select>
      </label>
      <label class="schalter">
        <input type="checkbox" id="opt-aufloesung" checked>
        Nach falscher Antwort die richtige Stelle zeigen
      </label>
      <label class="schalter">
        <input type="checkbox" id="opt-zufall" checked>
        Zufällige Reihenfolge
      </label>
      <label class="schalter">
        <input type="checkbox" id="opt-nur-gesetzte">
        Nur Fragen mit gesetztem Ziel
      </label>
    </div>

    <div id="warnung" class="hinweis warnung" hidden></div>

    <div class="knopfreihe">
      <button id="knopf-start" class="haupt">Runde starten</button>
      <button id="knopf-bearbeiten" class="neben">Fragen bearbeiten</button>
    </div>
  </div>
</section>

<!-- Spiel ----------------------------------------------------------------->
<section id="spiel" class="seite" hidden>
  <header class="spielkopf">
    <div class="frageblock">
      <span class="zaehler" id="spiel-zaehler">1 / 50</span>
      <span class="frage" id="spiel-frage">…</span>
    </div>
    <div class="statusblock">
      <span class="stat gut"><b id="spiel-richtig">0</b> richtig</span>
      <span class="stat schlecht"><b id="spiel-falsch">0</b> daneben</span>
      <span class="stat uhr" id="spiel-uhr">0:00</span>
    </div>
  </header>
  <div class="zeitbalken"><div id="zeitbalken-fuellung"></div></div>

  <div class="buehne" id="buehne">
    <div class="leinwand" id="leinwand">
      <img id="bild" alt="Wimmelbild">
      <div class="marker-ebene" id="marker"></div>
    </div>
    <div class="rueckmeldung" id="rueckmeldung" hidden></div>
  </div>

  <footer class="spielfuss">
    <button id="knopf-ueberspringen" class="neben">Überspringen (Leertaste)</button>
    <div class="zoomsteuerung">
      <button id="zoom-raus" class="rund" title="kleiner">−</button>
      <span id="zoom-wert">100 %</span>
      <button id="zoom-rein" class="rund" title="größer">+</button>
      <button id="zoom-zurueck" class="neben klein">ganzes Bild</button>
    </div>
    <button id="knopf-abbrechen" class="neben">Abbrechen</button>
  </footer>
</section>

<!-- Auswertung ------------------------------------------------------------>
<section id="ende" class="seite" hidden>
  <header class="kopf">
    <h1>Auswertung</h1>
    <p class="lead" id="ende-titel"></p>
  </header>
  <div class="inhalt">
    <div class="kennzahlen" id="ende-kennzahlen"></div>
    <h2>Übersicht im Bild</h2>
    <div class="uebersicht" id="ende-uebersicht"></div>
    <h2>Alle Fragen</h2>
    <div class="tabellenrahmen">
      <table class="ergebnisse" id="ende-tabelle"></table>
    </div>
    <div class="knopfreihe">
      <button id="knopf-nochmal" class="haupt">Nochmal</button>
      <button id="knopf-ergebnis" class="neben">Ergebnis als JSON</button>
      <button id="knopf-zurueck" class="neben">Zur Auswahl</button>
    </div>
  </div>
</section>

<!-- Editor ---------------------------------------------------------------->
<section id="editor" class="seite" hidden>
  <header class="editorkopf">
    <div class="titelblock">
      <input id="ed-titel" class="titelfeld" placeholder="Titel" aria-label="Titel">
      <label class="kennungsfeld">Kennung
        <input id="ed-id" aria-label="Kennung">
      </label>
      <span id="ed-herkunft" class="kennzeichen"></span>
    </div>
    <div class="statusblock">
      <span class="stat" id="ed-stand"></span>
      <button id="ed-speichern" class="neben klein">Speichern</button>
    </div>
  </header>

  <div class="editor-koerper">
    <div class="buehne" id="ed-buehne">
      <div class="leinwand" id="ed-leinwand">
        <img id="ed-bild" alt="">
        <div class="marker-ebene" id="ed-marker"></div>
      </div>
      <p class="buehne-hinweis" id="ed-hinweis" hidden></p>
    </div>

    <aside class="editor-liste">
      <div class="listenkopf">
        <button id="ed-neu-frage" class="neben klein">+ Frage</button>
        <button id="ed-import" class="neben klein">Fragen importieren…</button>
        <button id="ed-reihum" class="neben klein" aria-pressed="false">Reihum setzen</button>
      </div>
      <ol id="ed-fragen" class="fragenliste"></ol>
    </aside>
  </div>

  <footer class="spielfuss">
    <div class="knopfgruppe">
      <button id="ed-export" class="haupt">Exportieren…</button>
      <button id="ed-bild-ersetzen" class="neben klein">Bild ersetzen…</button>
      <button id="ed-einstellungen" class="neben klein">Einstellungen…</button>
      <button id="ed-verwerfen" class="neben klein" hidden>Änderungen verwerfen</button>
    </div>
    <div class="zoomsteuerung">
      <button id="ed-zoom-raus" class="rund">−</button>
      <span id="ed-zoom-wert">100 %</span>
      <button id="ed-zoom-rein" class="rund">+</button>
      <button id="ed-zoom-zurueck" class="neben klein">ganzes Bild</button>
    </div>
    <button id="ed-fertig" class="neben">Fertig</button>
  </footer>
</section>

<script src="js/hilfen.js"></script>
<script src="js/wimmelbild.js"></script>
<script src="js/bild.js"></script>
<script src="js/ansicht.js"></script>
<!-- Fest eingebaute Bildsätze: je Wimmelbild eine Datei, hier eine Zeile. -->
<script src="data/dorfplatz.js"></script>
<script src="js/aufnahme.js"></script>
<script src="js/editor.js"></script>
<script src="js/app.js"></script>

<pre id="protokoll" style="position:fixed;inset:0;z-index:99;background:#fff;padding:20px;
  font:13px/1.45 monospace;white-space:pre-wrap;overflow:auto;margin:0"></pre>
<script>
var P = document.getElementById('protokoll');
function sag(t){ P.textContent += t + '\n'; }
function knopf(text){
  return [].slice.call(document.querySelectorAll('.dialog button'))
    .filter(function(b){ return b.textContent === text; })[0];
}
var img = new Image();
img.onload = function(){
  var c = document.createElement('canvas');
  c.width = img.naturalWidth; c.height = img.naturalHeight;
  c.getContext('2d').drawImage(img,0,0);
  c.toBlob(function(blob){
    document.getElementById('knopf-neu').click();
    var dt = new DataTransfer();
    dt.items.add(new File([blob], 'neues-blatt.jpg', {type:'image/jpeg'}));
    var ein = document.querySelector('.dialog input[type=file]');
    ein.files = dt.files;
    ein.dispatchEvent(new Event('change', {bubbles:true}));

    setTimeout(function(){
      sag('1) Bild aufgenommen, Zuschnitt erkannt');
      knopf('Weiter').click();
      setTimeout(function(){
        // Namensdialog
        var felder = document.querySelectorAll('.dialog input');
        sag('2) Namensvorschlag: Titel="' + felder[0].value + '" Kennung="' + felder[1].value + '"');
        knopf('Anlegen').click();
        setTimeout(function(){
          var s = Editor.offenerSatz();
          sag('3) Satz angelegt: ' + s.id + ', Bild ' + s.bildGroesse.breite + 'x' + s.bildGroesse.hoehe
              + ', Raum ' + s.koordinatenRaum.breite + 'x' + s.koordinatenRaum.hoehe
              + ', ' + s.fragen.length + ' Fragen');

          // Fragen als Text importieren
          document.getElementById('ed-import').click();
          var ta = document.querySelector('.dialog textarea');
          ta.value = 'Nr.  Frage  Koordinaten (x,y)\n'
            + '1. Wo ist der rote Luftballon? (210,80)   26. Wo ist der Hydrant? (930,870)\n'
            + '2. Wo ist die alte Laterne?  80 ; 120\n'
            + 'Wo ist der Schwan?';
          ta.dispatchEvent(new Event('input', {bubbles:true}));
          sag('4) ' + document.querySelector('.dialog .vorschau').textContent);
          knopf('Übernehmen').click();

          setTimeout(function(){
            var s2 = Editor.offenerSatz();
            sag('5) nach Import: ' + s2.fragen.length + ' Fragen, offen: '
                + Wimmelbild.offeneZiele(s2));
            sag('   ' + s2.fragen.map(function(f){
              return f.nr + '. ' + f.ziel + (f.gesetzt ? ' ('+f.x+','+f.y+')' : ' [ohne]');
            }).join('\n   '));

            // letzte Frage im Bild setzen
            var b = document.getElementById('ed-buehne');
            var r = b.getBoundingClientRect();
            Editor.waehlenFuerTest ? 0 : 0;
            document.querySelectorAll('#ed-fragen .zeile-kopf')[3].click();
            ['pointerdown','pointerup'].forEach(function(t){
              b.dispatchEvent(new MouseEvent(t,{clientX:r.left+r.width/2,clientY:r.top+r.height/2,bubbles:true}));
            });
            var f4 = Editor.offenerSatz().fragen[3];
            sag('6) Stelle gesetzt für "' + f4.ziel + '": ' + f4.x + ',' + f4.y
                + ' – offen jetzt: ' + Wimmelbild.offeneZiele(Editor.offenerSatz()));

            setTimeout(function(){
              // Export
              document.getElementById('ed-export').click();
              sag('7) Export als Modul:');
              sag(document.querySelector('.dialog textarea').value.split('\n').slice(0,14).join('\n'));
              var radios = document.querySelectorAll('.dialog input[type=radio]');
              radios[1].checked = true;
              radios[1].dispatchEvent(new Event('change',{bubbles:true}));
              var j = document.querySelector('.dialog textarea').value;
              sag('8) JSON-Vorschau: ' + j.slice(0,80).replace(/\n/g,' '));
              // Wiedereinlesen prüfen
              var wieder = Wimmelbild.ausJson(Wimmelbild.alsJson(Editor.offenerSatz()));
              sag('9) JSON wieder eingelesen: ' + wieder.satz.fragen.length + ' Fragen, Bild '
                  + (wieder.satz.bild.slice(0,11)) + '… ' + Math.round(Bild.groesse(wieder.satz.bild)/1024) + ' kB');
              sag('\nFERTIG');
            }, 900);
          }, 100);
        }, 100);
      }, 100);
    }, 800);
  }, 'image/jpeg', 0.92);
};
img.src = 'source/dorfplatz-original.jpg';
</script>
</body>
</html>
