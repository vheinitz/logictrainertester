<!DOCTYPE html><meta charset="utf-8"><body style="font:16px monospace;padding:20px">
<pre id="aus">läuft…</pre>
<script src="js/hilfen.js"></script><script src="js/wimmelbild.js"></script><script src="js/bild.js"></script>
<script>
var img = new Image();
img.onload = function(){
  var t0 = performance.now();
  var b = Bild.bereichFinden(img);
  var t1 = performance.now();
  var z = Bild.zuschneiden(img, b);
  var t2 = performance.now();
  document.getElementById('aus').textContent =
    'Quelle       : ' + img.naturalWidth + 'x' + img.naturalHeight + '\n' +
    'Bereich      : x=' + b.x + ' y=' + b.y + ' ' + b.breite + 'x' + b.hoehe + '\n' +
    'Python sagte : x=0 y=117 1152x934\n' +
    'Zuschnitt    : ' + z.breite + 'x' + z.hoehe + ', ' + Math.round(Bild.groesse(z.datenUri)/1024) + ' kB\n' +
    'Dauer        : erkennen ' + Math.round(t1-t0) + ' ms, schneiden ' + Math.round(t2-t1) + ' ms';
};
img.onerror = function(){ document.getElementById('aus').textContent = 'Bild nicht ladbar'; };
img.src = 'source/dorfplatz-original.jpg';
</script></body>
